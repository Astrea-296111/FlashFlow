name: Reproducible benchmark
on:
  workflow_dispatch:
    inputs:
      requests:
        description: Requests per run
        default: '2000'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: local-development-secret-change-this-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r benchmark/requirements.txt
      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v1.3.0/k6-v1.3.0-linux-amd64.tar.gz -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          echo /tmp/k6-v1.3.0-linux-amd64 >> "$GITHUB_PATH"
      - run: docker compose up --build -d
        env:
          RATE_LIMIT_ENABLED: 'false'
      - name: Run three paired trials
        run: python benchmark/scripts/run.py --requests "${{ inputs.requests }}" --v-us 40 --repeats 3
      - run: docker compose logs --no-color > benchmark/results/compose.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: benchmark-evidence, path: benchmark/results/}
      - run: docker compose down
        if: always()
